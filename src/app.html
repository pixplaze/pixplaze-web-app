<!DOCTYPE html>
<!--suppress ALL -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
		<meta name="theme-color" content="#5CBB3A" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Pixplaze" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<!-- ICO — для браузеров без SVG-иконок; sizes="32x32", а не "any": иначе Chrome предпочтёт ICO вместо SVG -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" crossorigin="anonymous"/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<!--		<link rel="stylesheet" href="%sveltekit.assets%/style/global.css">-->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
	<div id="app" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
