<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101827" />
    <title>Нет подключения</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;

        --ui-size-block: 40px;
        --ui-size-border: 2px;
        --ui-size-text: 16px;
        --ui-size-shadow: 4px;

        --ui-spacing: 20px;
        --ui-padding: 20px;

        --color-ui-primary: #5CBB3A;
        --color-ui-primary-lighter: #63C83F;
        --color-ui-secondary: #52A435;
        --color-ui-border: #42A021;
        --color-ui-shadow: rgba(0, 0, 0, 15%);

        --color-gray-dark: #444444;
        --color-main-dark: #52A435;
        --color-text-secondary: #F6F8FA;

        --color-ui-button-text: var(--color-text-secondary);
        --color-ui-button-border: var(--color-ui-border);
        --color-ui-button-background: var(--color-ui-primary);
        --color-ui-button-shadow: var(--color-ui-shadow);
        --color-ui-button-hover-background: var(--color-ui-primary-lighter);
        --color-ui-button-active-border: var(--color-ui-primary-lighter);
        --color-ui-button-active-background: var(--color-ui-secondary);
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        color: #edf2f7;
        background: var(--color-gray-dark);
        text-align: center;
      }
      main { max-width: 32rem; }
      h1 { margin-bottom: 0.5rem; font-size: clamp(1.6rem, 5vw, 2.2rem); }
      p { color: #b7c2d0; line-height: 1.6; }

      button.button {
        display: flex;
        align-items: center;
        justify-content: center;

        width: 100%;
        height: var(--ui-size-block);
        min-width: var(--ui-size-block);
        min-height: var(--ui-size-block);

        padding-left: var(--ui-padding);
        padding-right: var(--ui-padding);

        cursor: pointer;
        user-select: none;
        vertical-align: middle;
        color: var(--color-ui-button-text);
        border: var(--ui-size-border) solid var(--color-ui-button-border);
        background-color: var(--color-ui-button-background);
        box-shadow: inset 0 calc(-1 * var(--ui-size-shadow)) 0 0 var(--color-ui-button-shadow);
        transition: background-color .2s ease-out;
        padding-bottom: var(--ui-size-shadow);
      }

      button.button:focus {
        outline-style: none;
      }

      button.button:hover {
        background-color: var(--color-ui-button-hover-background);
      }

      button.button:active {
        background-color: var(--color-ui-button-active-background);
        border-color: var(--color-ui-button-active-border);
        box-shadow: none;
        padding-bottom: 0;
      }

      button.button:disabled {
        background-color: var(--color-ui-button-disabled-background);
        border-color: var(--color-ui-button-disabled-border);
        box-shadow: none;
        padding-bottom: 0;

        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет подключения к интернету</h1>
      <p>Проверьте соединение и попробуйте открыть страницу ещё раз.</p>
      <button class="button" type="button" onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
